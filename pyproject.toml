[project]
name = "detr-python-env"
version = "0.1.0"
description = "Python environment accessed through ScalaPy by DimWit and the l-shape dataset loader"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    # The CUDA build is what the cluster trains on; a desk reading results gets plain jax.
    "jax[cuda12]>=0.8.2 ; sys_platform == 'linux'",
    "jax>=0.8.2 ; sys_platform != 'linux'",
    "numpy>=2.0",
    # The Hungarian algorithm DETR matches its queries by, written in JAX.
    "optax>=0.2.8",
    # Used by src/main/resources/python/l_shape_dataset.py to fetch the dataset;
    # hf-xet makes the ~8.6 GB train split download noticeably faster.
    "huggingface-hub[hf-xet]>=0.36",
]

# Reading what a run measured, not running one: plot_run.py and the interactive window.
[dependency-groups]
analysis = [
    "pandas>=2.2",
    "seaborn>=0.13",
    "matplotlib>=3.9",
    "pillow>=10.0",
    "ipykernel>=6.29",
    "umap-learn>=0.5.7",
]

[tool.uv]
python-preference = "only-managed"
