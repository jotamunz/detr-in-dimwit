[project]
name = "llava-python-env"
version = "0.1.0"
description = "Python environment for visual instruction tuning"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "transformers>=4.46",
    "huggingface-hub[hf-xet]>=0.36",
    "pyarrow>=17.0",
]

[tool.uv]
python-preference = "only-managed"
